:root { --brand: #0158ab; --orange: #ff5400; --sky: #5cadf5; --text: #000912; --text-secondary: #30425a; --page: #eef2f6;
        --font: "Gilroy WN", Gilroy, Inter, Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font-family: var(--font); padding: 24px 16px; }
.node { max-width: 1100px; margin: 0 auto; }
.stage { position: relative; aspect-ratio: 1 / 1; border-radius: 24px; overflow: hidden; background: #3a3b3c; }
.scene { position: absolute; left: 0; top: 0; width: 1400px; height: 1400px; transform-origin: 0 0; transform: scale(var(--k, 1)); }
.scene img { position: absolute; inset: 0; width: 1400px; height: 1400px; max-width: none; }
.plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: visible; }
.tx { font-family: var(--font); }
.stack { position: absolute; left: 0; top: 0; width: 1100px; height: 1100px; transform-origin: 0 0; transform: scale(var(--ks, 1)); }
.blk { position: absolute; font-size: calc(23px * var(--s, 1)); }   /* 19.10.2026: 18 → 23 px, Михаил: «слишком мелко» */
.blk p { margin: 0; }
.blk li, .blk p, .blk h2, .blk h3 { text-wrap: pretty; }
/* заголовок: белый текст прямо на тёмной стене */
.b-head { color: #fff; display: grid; gap: .5em; text-shadow: 0 1px 12px rgba(0,9,18,.35); }
.b-head .eyebrow { font-size: .9em; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.b-head h2 { margin: 0; font-size: 2.4em; line-height: 1.08; font-weight: 700; letter-spacing: -.005em; text-wrap: balance; }
.b-head .codes { display: grid; gap: .3em; margin-top: .3em; font-size: 1.05em; font-weight: 500; }
/* блок на тёмной стене: тонкая рамка, оранжевый заголовок, белый текст */
.dark:not(.b-head) { color: #fff; border: 1px solid rgba(255,255,255,.38); border-radius: 6px; background: rgba(255,255,255,.04);
        padding: 1.15em; display: flex; flex-direction: column; gap: .55em; box-sizing: border-box; }
.dark h3 { margin: 0 0 .1em; font-size: 1.15em; font-weight: 600; color: var(--orange); }
.dark:not(.b-head) h3, .dark:not(.b-head) p, .dark:not(.b-head) li { text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 0 10px rgba(0,0,0,.35); }
.dark p { font-size: 1em; font-weight: 400; line-height: 1.35; }
.dark ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .4em; }
.dark li { position: relative; padding-left: 1em; font-size: .95em; line-height: 1.35; font-weight: 400; }
.dark li b { font-weight: 600; }
.dark li::before { content: ""; position: absolute; left: 0; top: .5em; width: .34em; height: .34em; border-radius: 50%; background: var(--orange); }
.stack .dark:not(.b-compat) h3 { color: var(--sky); }
.stack .dark:not(.b-compat) li::before { background: var(--sky); }
.b-compat p, .blk h3 { white-space: nowrap; }
/* заголовок: всегда в правом верхнем углу на тёмном градиентном стекле (Figma 1587:1513, правка Михаила 19.10.2026) */
.b-head.plate { background: linear-gradient(269.37deg, rgba(0,9,18,.30) 0.2%, rgba(0,9,18,0) 99.8%);
  border: 0; border-radius: 8.6px; padding: 17px; gap: 17px; text-shadow: none;
  backdrop-filter: blur(5.4px); -webkit-backdrop-filter: blur(5.4px); box-shadow: 0 2px 21px rgba(0,0,0,.06); }
/* Figma 1587:1513 (кадр 2048 → 1100, ×0,537): надзаголовок 32→17 px в одну строку, H2 64→34 px, коды 32→17 px */
.b-head.plate .eyebrow { font-size: 22px; font-weight: 600; line-height: 1; letter-spacing: 0; white-space: nowrap; }
.b-head.plate h2 { font-size: 68px; font-weight: 600; line-height: 1.02; letter-spacing: 0; }
.b-head.plate .codes { margin: 0; gap: 10px; font-size: 22px; font-weight: 600; line-height: 1; color: rgba(255,255,255,.9); }
/* телефонная подложка заголовка: только если на телефоне под ним светлый фон (контракт блоков 2.1) */
@media (max-width: 720px) { .stack .b-head.plate-m { box-sizing: content-box; background: rgba(8,12,18,.5); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 1em 1.25em 1.1em;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); text-shadow: none; } }
/* шильдик «Сухой монтаж»: жидкое стекло WINAL */
.b-badge { display: flex; align-items: center; gap: .55em; padding: .42em 1em .42em .42em; border-radius: 999px; box-sizing: border-box;
  background: linear-gradient(160deg, rgba(255,255,255,.9), rgba(246,250,255,.66) 55%, rgba(220,236,252,.78));
  border: 1px solid rgba(255,255,255,.85);
  backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -10px 18px rgba(1,88,171,.10), 0 12px 30px rgba(0,9,18,.25); }
.b-badge .ico { flex: none; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 32% 28%, #b9f0a6 0, #5fbf4a 38%, #2f8a2e 100%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.9), inset 0 -3px 6px rgba(0,60,0,.35), 0 3px 8px rgba(30,110,30,.35); }
.b-badge .ico svg { width: 1.25em; height: 1.25em; filter: drop-shadow(0 1px 1px rgba(0,60,0,.35)); }
.b-badge .lbl { font-size: 1.1em; font-weight: 700; color: var(--brand); letter-spacing: .005em; white-space: nowrap; }
.b-badge.img { display: block; padding: 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 0;
  filter: drop-shadow(0 10px 22px rgba(0,9,18,.22)); }
/* блок на светлом: стеклянная плашка, синий заголовок */
.glass { background: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.7); border-radius: 8px;
         backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
         box-shadow: 0 10px 30px rgba(0,9,18,.14); padding: 1.15em; display: flex; flex-direction: column; gap: .6em; box-sizing: border-box; }
.glass h3 { margin: 0; font-size: 1.35em; font-weight: 600; color: var(--brand); }
.glass p { font-size: 1em; line-height: 1.35; font-weight: 500; color: var(--text-secondary); }
.glass ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .4em; }
.glass li { position: relative; padding-left: 1.1em; font-size: .95em; line-height: 1.35; font-weight: 500; color: var(--text-secondary); }
.glass li b, .glass p.one b { color: var(--text); font-weight: 600; }
.dark p.one b { font-weight: 600; }
.glass li::before { content: ""; position: absolute; left: 0; top: .5em; width: .34em; height: .34em; border-radius: 50%; background: var(--brand); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6em; }
.cols > div { display: flex; flex-direction: column; gap: .6em; }
.right { text-align: right; } .right .codes { justify-items: end; }
/* телефон: заголовок остаётся на изображении, остальные блоки уходят под него */
@media (max-width: 720px) {
  body { padding: 12px; }
  .stack .blk:not(.b-head) { display: none; }
  .below .b-badge.img { width: 210px; padding: 0 !important; background: none !important; border: 0 !important; }
  .below .b-badge { justify-self: start; padding: .42em 1.15em .42em .42em !important; border-radius: 999px !important; background: #fff !important; }
  .stack .b-head { left: auto !important; right: max(var(--r), calc(14px / var(--ks))); top: max(var(--t), calc(14px / var(--ks))); width: calc(250px / var(--ks)) !important;
                   font-size: calc(10px / var(--ks)); gap: .35em; }
  .stack .b-head[data-mb] { top: auto !important; bottom: calc(14px / var(--ks)); }
  .stack .b-head .eyebrow { font-size: 1em; }
  .stack .b-head h2 { font-size: 2.1em; }
  .stack .b-head .codes { display: none; }
  .below .b-codes { display: grid; }
  .below { display: grid; gap: 10px; margin-top: 10px; }
  .below .blk { position: static; font-size: 15px; }
  .below .blk { color: var(--text); }
  .below .blk h3 { color: var(--brand); }
  .below .blk li::before { background: var(--brand); }
  .below .glass, .below .dark { background: #fff; border: 1px solid #dde4ec; border-radius: 14px; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 18px 20px; }
  .below .dark p, .below .dark li { color: var(--text-secondary); }
  .below .xx { background: #fff; border: 1px solid #dde4ec; border-radius: 14px; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
}
@media (min-width: 721px) { .below { display: none; } }
.b-codes { display: none; }

@keyframes grow { from { transform: scaleX(.001); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.play .a-ln { transform-box: fill-box; transform-origin: center; animation: grow 600ms cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(250ms + var(--g) * 330ms); }
.play .a-tk { animation: fade 300ms ease-out both; animation-delay: calc(720ms + var(--g) * 330ms); }
.play .a-tx { animation: fade 500ms ease-out both; animation-delay: calc(450ms + var(--g) * 330ms); }
.play .stack .blk { animation: rise 900ms cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(400ms + var(--n) * 330ms + var(--b) * 160ms); }
.bar { display: flex; justify-content: flex-end; margin-top: 12px; }
.bar button { font: 600 15px/1 var(--font); color: var(--brand); background: #fff; border: 1px solid #dde4ec; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
.bar button:hover { border-color: var(--brand); }
@media (prefers-reduced-motion: reduce) { .play * { animation: none !important; } }
</style>
